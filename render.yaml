# Blueprint de Render para el backend (API).
# En Render: New > Blueprint > elige este repositorio.
# Las variables marcadas con "sync: false" te las pide Render al crear el servicio.
services:
  - type: web
    name: hoventra-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Cadena de conexión de Neon (postgresql://...?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # URL exacta del frontend en Vercel, sin "/" al final
      - key: FRONTEND_URL
        sync: false
      # Contraseña del propietario inicial (solo se usa con la base vacía)
      - key: ADMIN_PASSWORD
        sync: false
      # Clave de firma de sesiones: Render la genera aleatoria automáticamente
      - key: JWT_SECRET
        generateValue: true
